<!DOCTYPE html>
<html>
<head>
    <title>Satellite Classifier</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">
    <h1>🌍 Satellite Image Classifier</h1>
    <p>Upload an image to classify land type</p>

    <form method="POST" enctype="multipart/form-data">
        <input type="file" name="file" required>
        <button type="submit">Predict</button>
    </form>

    {% if prediction %}
        <div class="result">
            <h2>Prediction:</h2>
            <p>{{ prediction }}</p>
        </div>
    {% endif %}
</div>

</body>
</html>
